name: Witness execution lineage
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-boundary.txt
      - run: python -m pytest tests -q
      - run: python scripts/check_examples.py
      - run: python scripts/verify_receipt_chain.py tests/fixtures/boundary-bundle.json tests/fixtures/boundary-trust.json
